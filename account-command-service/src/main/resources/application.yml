server:
  port: 8081

spring:
  config:
    import: optional:configserver:${SPRING_CONFIG_IMPORT:http://localhost:8888}
  application:
    name: account-command-service
  # v2 §7: ShardingSphere Driver routes logical INSERTs into ledger_events to the
  # region shard (ds_apac / ds_eu / ds_amer) selected by the registration-IP region.
  # Config file to be added when the fragmentation retrofit lands (v2 §9, step 6).
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/ledger}
    username: ddbs
    password: ddbs
  jpa:
    hibernate:
      # schema is Flyway-managed (db/migration) — validate only, never mutate
      ddl-auto: validate
    show-sql: false
  flyway:
    locations: classpath:db/migration
    default-schema: account_command
    schemas: account_command
    create-schemas: true
    baseline-on-migrate: true
  # v2 §5: withdrawal commands arrive on a Kafka partition keyed by accountId,
  # so a single consumer instance applies them in broker-received (FCFS) order.
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: account-command-service
      properties:
        spring.json.trusted.packages: '*'
  data:
    redis:
      host: localhost
      port: 6379

# v2 §5.2: Redisson client against Valkey; provides RFairLock("account-lock:" + accountId).
redisson:
  single-server-config:
    address: "redis://localhost:6379"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true

management:
  endpoint:
    health:
      show-details: always   # expose db/kafka/redis indicators for compose healthcheck + CI
