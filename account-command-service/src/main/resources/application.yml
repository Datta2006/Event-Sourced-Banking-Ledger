server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: account-command-service
  config:
    import: optional:configserver:${SPRING_CONFIG_IMPORT:http://localhost:8888}
  # Coordinator database: idempotency keys, transfer saga state, account→region directory.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/ledger}
    username: ${SPRING_DATASOURCE_USERNAME:ddbs}
    password: ${SPRING_DATASOURCE_PASSWORD:ddbs}
    hikari:
      maximum-pool-size: 10
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
    consumer:
      group-id: account-command-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

redisson:
  single-server-config:
    address: ${REDISSON_ADDRESS:redis://localhost:6379}

app:
  shards:
    APAC: ${SHARD_APAC_URL:jdbc:postgresql://localhost:5433/ddbs_apac}
    EU:   ${SHARD_EU_URL:jdbc:postgresql://localhost:5433/ddbs_eu}
    AMER: ${SHARD_AMER_URL:jdbc:postgresql://localhost:5433/ddbs_amer}
  db:
    username: ${SHARD_DB_USERNAME:ddbs}
    password: ${SHARD_DB_PASSWORD:ddbs}
  saga:
    # Demo hook: pause between source debit and target credit so a script can kill
    # the process and prove startup recovery. 0 in normal operation.
    pause-after-source-ms: ${SAGA_PAUSE_AFTER_SOURCE_MS:0}
  region:
    default: APAC
  jwt:
    # Gateway validates tokens; services only consume the injected caller headers.

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    redis:
      enabled: false

logging:
  pattern:
    console: "%d{ISO8601} %-5level [%X{correlationId:-no-correlation}] %logger{36} - %msg%n"
