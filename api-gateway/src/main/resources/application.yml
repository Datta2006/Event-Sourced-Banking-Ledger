server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      # The frontend calls /api/<segment>/... — strip the /api prefix, then
      # route by the next segment to the owning service (lb:// = Eureka).
      routes:
        - id: account-command
          uri: lb://account-command-service
          predicates:
            - Path=/api/accounts/**,/api/transfers/**
          filters:
            - StripPrefix=1
        - id: ledger-query
          uri: lb://ledger-query-service
          predicates:
            - Path=/api/ledger/**,/api/events/**,/api/transactions/**
          filters:
            - StripPrefix=1
        - id: loan
          uri: lb://loan-service
          predicates:
            - Path=/api/loans/**
          filters:
            - StripPrefix=1
        - id: payment-reservation
          uri: lb://payment-reservation-service
          predicates:
            - Path=/api/reservations/**
          filters:
            - StripPrefix=1
        - id: trust-score
          uri: lb://trust-score-service
          predicates:
            - Path=/api/trust-score/**
          filters:
            - StripPrefix=1
        - id: fraud
          uri: lb://fraud-detection-service
          predicates:
            - Path=/api/fraud/**
          filters:
            - StripPrefix=1
        - id: notification
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=1

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: false
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,gateway

logging:
  level:
    org.springframework.cloud.gateway: INFO
