version: "3.9"

# v2 local demo topology (see docs/DEPLOYMENT.md).
# Postgres is split into 3 region shards (ds_apac / ds_eu / ds_amer) to prove the
# ShardingSphere fragmentation concept — deliberately not exhaustive (v2 §7).
# Valkey replaces Redis (BSD vs SSPL — v2 §0); MongoDB is kept with FerretDB noted
# as the OSI-clean swap (docs/OPEN_DECISIONS.md).

services:
  # --- Service Discovery ---
  eureka-server:
    image: ddbs-eureka-server:0.2.0
    build:
      context: .
      dockerfile: infra/eureka/Dockerfile
    ports:
      - "8761:8761"
    environment:
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false
    networks:
      - ddbs-network

  # --- Centralized Config ---
  config-server:
    image: ddbs-config-server:0.2.0
    build:
      context: .
      dockerfile: infra/config/Dockerfile
    ports:
      - "8888:8888"
    environment:
      - SPRING_CLOUD_CONFIG_SERVER_GIT_URI=file:///tmp/ddbs-config-repo
    volumes:
      - ./infra/config-repo:/tmp/ddbs-config-repo
    networks:
      - ddbs-network
    depends_on:
      - eureka-server

  # --- Valkey (Redisson backend: loan priority queue, admin pool Lua debit, RFairLock) ---
  valkey:
    image: valkey/valkey:8.1
    ports:
      - "6379:6379"
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - ddbs-valkey-data:/data
    networks:
      - ddbs-network

  # --- Kafka (partition-per-account ordering + event streaming) ---
  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      # KRaft mode — no Zookeeper
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    volumes:
      - ddbs-kafka-data:/bitnami/kafka
    networks:
      - ddbs-network

  # --- PostgreSQL region shards (hybrid fragmentation, v2 §7) ---
  postgres-apac:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ddbs_apac
      POSTGRES_USER: ddbs
      POSTGRES_PASSWORD: ddbs
    volumes:
      - ddbs-postgres-apac-data:/var/lib/postgresql/data
    networks:
      - ddbs-network

  postgres-eu:
    image: postgres:16-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: ddbs_eu
      POSTGRES_USER: ddbs
      POSTGRES_PASSWORD: ddbs
    volumes:
      - ddbs-postgres-eu-data:/var/lib/postgresql/data
    networks:
      - ddbs-network

  postgres-amer:
    image: postgres:16-alpine
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: ddbs_amer
      POSTGRES_USER: ddbs
      POSTGRES_PASSWORD: ddbs
    volumes:
      - ddbs-postgres-amer-data:/var/lib/postgresql/data
    networks:
      - ddbs-network

  # --- MongoDB (read model; FerretDB is the drop-in Apache-2.0 swap — docs/OPEN_DECISIONS.md) ---
  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ddbs
    volumes:
      - ddbs-mongo-data:/data/db
    networks:
      - ddbs-network

  # --- MailHog (fake SMTP for dev/notifications demo) ---
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - ddbs-network

  # --- API Gateway ---
  api-gateway:
    image: ddbs-api-gateway:0.2.0
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_CLOUD_GATEWAY_DISCOVERY_LOCATOR_ENABLED=true
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    networks:
      - ddbs-network
    depends_on:
      - eureka-server
      - config-server

  # --- Account Command Service ---
  account-command-service:
    image: ddbs-account-command:0.2.0
    build:
      context: ./account-command-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      # v2 §7: ShardingSphere routes by region across the three shards below
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-apac:5432/ddbs_apac
      - SPRING_DATASOURCE_USERNAME=ddbs
      - SPRING_DATASOURCE_PASSWORD=ddbs
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_DATA_REDIS_HOST=valkey
      - REDISSON_ADDRESS=redis://valkey:6379
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    networks:
      - ddbs-network
    depends_on:
      - eureka-server
      - config-server
      - postgres-apac
      - postgres-eu
      - postgres-amer
      - kafka
      - valkey

  # --- Ledger Query Service ---
  ledger-query-service:
    image: ddbs-ledger-query:0.2.0
    build:
      context: ./ledger-query-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/ddbs
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-apac:5432/ddbs_apac
      - SPRING_DATASOURCE_USERNAME=ddbs
      - SPRING_DATASOURCE_PASSWORD=ddbs
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    networks:
      - ddbs-network
    depends_on:
      - eureka-server
      - config-server
      - mongo
      - kafka
      - postgres-apac
      - postgres-eu
      - postgres-amer

  # --- Fraud Detection Service ---
  fraud-detection-service:
    image: ddbs-fraud-detection:0.2.0
    build:
      context: ./fraud-detection-service
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    networks:
      - ddbs-network
    depends_on:
      - eureka-server
      - config-server
      - kafka

  # --- Notification Service ---
  notification-service:
    image: ddbs-notification:0.2.0
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    ports:
      - "8084:8084"
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_MAIL_HOST=mailhog
      - SPRING_MAIL_PORT=1025
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    networks:
      - ddbs-network
    depends_on:
      - eureka-server
      - config-server
      - kafka
      - mailhog

  # --- Loan Service ---
  loan-service:
    image: ddbs-loan:0.2.0
    build:
      context: ./loan-service
      dockerfile: Dockerfile
    ports:
      - "8085:8085"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-apac:5432/ddbs_apac
      - SPRING_DATASOURCE_USERNAME=ddbs
      - SPRING_DATASOURCE_PASSWORD=ddbs
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_DATA_REDIS_HOST=valkey
      - REDISSON_ADDRESS=redis://valkey:6379
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    networks:
      - ddbs-network
    depends_on:
      - eureka-server
      - config-server
      - postgres-apac
      - kafka
      - valkey

  # --- Payment & Reservation Service ---
  payment-reservation-service:
    image: ddbs-payment-reservation:0.2.0
    build:
      context: ./payment-reservation-service
      dockerfile: Dockerfile
    ports:
      - "8086:8086"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-apac:5432/ddbs_apac
      - SPRING_DATASOURCE_USERNAME=ddbs
      - SPRING_DATASOURCE_PASSWORD=ddbs
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_DATA_REDIS_HOST=valkey
      - REDISSON_ADDRESS=redis://valkey:6379
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    networks:
      - ddbs-network
    depends_on:
      - eureka-server
      - config-server
      - postgres-apac
      - kafka
      - valkey

  # --- Trust Score Service ---
  trust-score-service:
    image: ddbs-trust-score:0.2.0
    build:
      context: ./trust-score-service
      dockerfile: Dockerfile
    ports:
      - "8087:8087"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-apac:5432/ddbs_apac
      - SPRING_DATASOURCE_USERNAME=ddbs
      - SPRING_DATASOURCE_PASSWORD=ddbs
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
    networks:
      - ddbs-network
    depends_on:
      - eureka-server
      - config-server
      - postgres-apac
      - kafka

volumes:
  ddbs-valkey-data:
  ddbs-kafka-data:
  ddbs-postgres-apac-data:
  ddbs-postgres-eu-data:
  ddbs-postgres-amer-data:
  ddbs-mongo-data:

networks:
  ddbs-network:
    driver: bridge
