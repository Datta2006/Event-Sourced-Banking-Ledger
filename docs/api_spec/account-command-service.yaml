openapi: 3.0.3
info:
  title: Account Command Service API
  version: 0.4.0
  description: >
    Write side of account aggregates (v2 §2, §5, §6). Commands are validated,
    appended as events to the region-sharded ledger_events store (ShardingSphere-JDBC),
    and published to Kafka. Withdrawal commands are ordered FCFS via Kafka
    partition-per-account plus Redisson RFairLock.
paths:
  /api/accounts:
    post:
      summary: Open an account
      description: >
        Resolves the registration IP to a region (ip-location-db) which becomes the
        account's shard key for horizontal fragmentation (v2 §7.1).
      operationId: openAccount
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [holderName, registrationIp, initialDeposit]
              properties:
                holderName:
                  type: string
                registrationIp:
                  type: string
                  format: ipv4
                initialDeposit:
                  type: number
                  format: double
      responses:
        '201':
          description: Account opened (AccountOpened event appended)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSnapshot'
  /api/accounts/{accountId}/deposits:
    post:
      summary: Deposit money
      operationId: deposit
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmountRequest'
      responses:
        '201':
          description: MoneyDeposited event appended
        '404':
          description: Account not found
  /api/accounts/{accountId}/withdrawals:
    post:
      summary: Withdraw money
      description: >
        The command is published to the account.commands topic keyed by accountId;
        the consumer applies it under RFairLock("account-lock:{accountId}") (v2 §5).
      operationId: withdraw
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmountRequest'
      responses:
        '202':
          description: WithdrawCommand accepted for ordered processing
        '400':
          description: Insufficient balance (rejected at apply time)
  /api/accounts/{accountId}/close:
    post:
      summary: Close an account (bank action)
      description: >
        Bank-side lifecycle action. Rejected if reservedBalance > 0 (open holds
        must be captured or released first). Appends AccountClosed; the read
        model marks the account CLOSED and it disappears from customer lists.
      operationId: closeAccount
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: AccountClosed appended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSnapshot'
        '409':
          description: Account has open reservations or is already closed
        '404':
          description: Account not found
  /api/accounts/{accountId}/kyc:
    post:
      summary: Update KYC status (bank action)
      operationId: setKycStatus
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kycStatus]
              properties:
                kycStatus:
                  type: string
                  enum: [PENDING, VERIFIED, REJECTED]
                note:
                  type: string
      responses:
        '200':
          description: KYC status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSnapshot'
        '404':
          description: Account not found
  /api/transfers:
    post:
      summary: Transfer money between accounts
      description: Orchestrated by the transfer saga (docs/SAGA_DESIGN.md).
      operationId: transfer
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromAccountId, toAccountId, amount]
              properties:
                fromAccountId:
                  type: string
                  format: uuid
                toAccountId:
                  type: string
                  format: uuid
                amount:
                  type: number
                  format: double
      responses:
        '202':
          description: TransferCommand accepted (saga started)
  /api/transfers/{transferId}:
    get:
      summary: Get transfer saga status
      description: >
        Saga progress for the transfer stepper UI (docs/SAGA_DESIGN.md §1): each
        status maps to a saga step (INITIATED → SOURCE_DEBITED → TARGET_CREDITED →
        COMPLETED; FAILED/COMPENSATED on the compensation path).
      operationId: getTransferStatus
      parameters:
        - name: transferId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current saga state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferStatusView'
        '404':
          description: Transfer not found
components:
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Client-supplied idempotency key persisted in processed_requests for 24h;
        retries replay the original result (v2 §6).
      schema:
        type: string
        maxLength: 64
  schemas:
    AccountSnapshot:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        holderName:
          type: string
        region:
          type: string
          enum: [APAC, EU, AMER]
          description: Resolved from registrationIp; the horizontal shard key (v2 §7.1)
        availableBalance:
          type: number
          format: double
        reservedBalance:
          type: number
          format: double
        status:
          type: string
          enum: [ACTIVE, CLOSED]
          description: Lifecycle status; CLOSED accounts are read-only
        kycStatus:
          type: string
          enum: [PENDING, VERIFIED, REJECTED]
        openedAt:
          type: string
          format: date-time
    TransferStatusView:
      type: object
      properties:
        transferId:
          type: string
          format: uuid
        fromAccountId:
          type: string
          format: uuid
        toAccountId:
          type: string
          format: uuid
        amount:
          type: number
          format: double
        status:
          type: string
          enum: [INITIATED, SOURCE_DEBITED, TARGET_CREDITED, COMPLETED, FAILED, COMPENSATED]
          description: Saga progress; FAILED/COMPENSATED mean TransferSourceReimbursed was appended
        startedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        failureReason:
          type: string
          nullable: true
    AmountRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          format: double
          minimum: 0.01
