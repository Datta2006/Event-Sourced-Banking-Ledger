openapi: 3.0.3
info:
  title: API Gateway
  version: 0.2.0
  description: >
    v2 §2 — Spring Cloud Gateway + Eureka discovery entry point. Routes to all
    7 backing services and forwards client Idempotency-Key headers (v2 §6).
    See the per-service specs in this directory for the actual endpoints.
paths:
  /api/accounts/{path}:
    x-gateway-route: account-command
    get:
      summary: Proxy to account-command-service
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Proxied response
  /api/transactions:
    x-gateway-route: ledger-query
    get:
      summary: Proxy to ledger-query-service
      responses:
        '200':
          description: Proxied response
  /api/loans/{path}:
    x-gateway-route: loans
    get:
      summary: Proxy to loan-service
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Proxied response
  /api/reservations/{path}:
    x-gateway-route: reservations
    get:
      summary: Proxy to payment-reservation-service
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Proxied response
  /api/trust-score/{path}:
    x-gateway-route: trust-score
    get:
      summary: Proxy to trust-score-service
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Proxied response
  /api/fraud/{path}:
    x-gateway-route: fraud
    get:
      summary: Proxy to fraud-detection-service
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Proxied response
  /api/notifications/{path}:
    x-gateway-route: notifications
    get:
      summary: Proxy to notification-service
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Proxied response
components:
  parameters:
    Path:
      name: path
      in: path
      required: true
      schema:
        type: string
