openapi: 3.0.3
info:
  title: Fraud Detection Service API
  version: 0.3.0
  description: >
    Carried over from v1 (v2 §2, §9 step 7). Consumes account and payment events
    from Kafka and evaluates fraud rules. Read-only HTTP surface for flagged cases.
paths:
  /api/fraud/cases:
    get:
      summary: List flagged fraud cases
      operationId: listFraudCases
      parameters:
        - name: accountId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [OPEN, REVIEWED, DISMISSED]
      responses:
        '200':
          description: Flagged cases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FraudCase'
  /api/fraud/cases/{caseId}:
    get:
      summary: Get a flagged fraud case
      operationId: getFraudCase
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Case detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FraudCase'
        '404':
          description: Case not found
  /api/fraud/cases/{caseId}/review:
    post:
      summary: Review or dismiss a flagged case (bank action)
      description: >
        Bank-side decision on an OPEN case. REVIEWED marks it actioned;
        DISMISSED marks it a false positive. Both append FraudCaseReviewed and
        notify the customer when the flag is cleared.
      operationId: reviewFraudCase
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [REVIEWED, DISMISSED]
                note:
                  type: string
      responses:
        '200':
          description: Updated case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FraudCase'
        '409':
          description: Case not OPEN
        '404':
          description: Case not found
components:
  parameters:
    CaseId:
      name: caseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-supplied idempotency key persisted in processed_requests for 24h.
      schema:
        type: string
        maxLength: 64
  schemas:
    FraudCase:
      type: object
      properties:
        caseId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        rule:
          type: string
          description: Fraud rule that fired (carried over from v1 rules)
        riskScore:
          type: integer
          minimum: 0
          maximum: 100
          description: Severity of the flag at trigger time
        triggeredByEvent:
          type: string
          description: Event type from account.events / payment.events that triggered the case
        status:
          type: string
          enum: [OPEN, REVIEWED, DISMISSED]
        flaggedAt:
          type: string
          format: date-time
        reviewedAt:
          type: string
          format: date-time
          nullable: true
