openapi: 3.0.3
info:
  title: Fraud Detection Service API
  version: 0.2.0
  description: >
    Carried over from v1 (v2 §2, §9 step 7). Consumes account and payment events
    from Kafka and evaluates fraud rules. Read-only HTTP surface for flagged cases.
paths:
  /api/fraud/cases:
    get:
      summary: List flagged fraud cases
      operationId: listFraudCases
      parameters:
        - name: accountId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [OPEN, REVIEWED, DISMISSED]
      responses:
        '200':
          description: Flagged cases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FraudCase'
  /api/fraud/cases/{caseId}:
    get:
      summary: Get a flagged fraud case
      operationId: getFraudCase
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Case detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FraudCase'
        '404':
          description: Case not found
components:
  schemas:
    FraudCase:
      type: object
      properties:
        caseId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        rule:
          type: string
          description: Fraud rule that fired (carried over from v1 rules)
        triggeredByEvent:
          type: string
          description: Event type from account.events / payment.events that triggered the case
        status:
          type: string
          enum: [OPEN, REVIEWED, DISMISSED]
        flaggedAt:
          type: string
          format: date-time
