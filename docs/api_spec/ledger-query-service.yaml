openapi: 3.0.3
info:
  title: Ledger Query Service API
  version: 0.3.0
  description: >
    Read side (v2 §2). Maintains the MongoDB/FerretDB read model from account events
    and serves transaction history. Also reads the region-sharded ledger_events via
    ShardingSphere-JDBC for replay and recovery (v2 §7).
paths:
  /api/transactions:
    get:
      summary: Query transaction history
      operationId: listTransactions
      parameters:
        - name: accountId
          in: query
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Page of transactions from the read model
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionView'
  /api/accounts:
    get:
      summary: List accounts (read model)
      description: >
        Read-model view of all accounts maintained from account events (v2 §2).
        Added for the ops/dashboard UI; balances trail the write side until the
        event is consumed.
      operationId: listAccounts
      responses:
        '200':
          description: All known accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountSummaryView'
  /api/events:
    get:
      summary: List recent events across all aggregates
      description: >
        Global event feed for the dashboard live stream — polled with `since` for
        incremental delivery. Ordered newest-first; served from the read model.
      operationId: listRecentEvents
      parameters:
        - name: since
          in: query
          description: Only events with occurredAt strictly after this instant.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        '200':
          description: Recent events, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventView'
  /api/accounts/{accountId}/events:
    get:
      summary: List events for an account
      description: Served from the region-sharded ledger_events store (v2 §7).
      operationId: listAccountEvents
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ordered event list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventView'
components:
  schemas:
    TransactionView:
      type: object
      properties:
        transactionId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        type:
          type: string
          enum: [DEPOSIT, WITHDRAWAL, TRANSFER_IN, TRANSFER_OUT, RESERVATION, CAPTURE, RELEASE, LOAN_DISBURSEMENT, LOAN_REPAYMENT]
        amount:
          type: number
          format: double
        occurredAt:
          type: string
          format: date-time
    EventView:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        aggregateId:
          type: string
          format: uuid
        version:
          type: integer
        type:
          type: string
        payload:
          type: object
          additionalProperties: true
        occurredAt:
          type: string
          format: date-time
        region:
          type: string
          enum: [APAC, EU, AMER]
    AccountSummaryView:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        holderName:
          type: string
        region:
          type: string
          enum: [APAC, EU, AMER]
        availableBalance:
          type: number
          format: double
        reservedBalance:
          type: number
          format: double
        updatedAt:
          type: string
          format: date-time
