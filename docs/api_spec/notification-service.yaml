openapi: 3.0.3
info:
  title: Notification Service API
  version: 0.3.0
  description: >
    Carried over from v1 (v2 §2, §9 step 7). Consumes domain events from Kafka
    (account, loan, payment, trust-score topics) and sends customer notifications
    via SMTP — MailHog in dev. HTTP surface is read-only for inspection.
paths:
  /api/notifications:
    get:
      summary: List sent notifications
      operationId: listNotifications
      parameters:
        - name: accountId
          in: query
          schema:
            type: string
            format: uuid
        - name: causeEvent
          in: query
          description: Filter by originating event type, e.g. TrustScoreChanged.
          schema:
            type: string
      responses:
        '200':
          description: Sent notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationView'
components:
  schemas:
    NotificationView:
      type: object
      properties:
        notificationId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        channel:
          type: string
          enum: [EMAIL]
        subject:
          type: string
        causeEvent:
          type: string
          description: e.g. LoanApproved, FundsCaptured, TrustScoreChanged
        deliveryStatus:
          type: string
          enum: [SENT, RETRYING, DEAD_LETTERED]
          description: SMTP delivery state; RETRYING/DEAD_LETTERED surface the DLQ state the bank log shows
        sentAt:
          type: string
          format: date-time
