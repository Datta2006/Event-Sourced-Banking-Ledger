server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    # Native backend: serve plain files from the mounted config repo. The git
    # backend requires a real .git directory, which the read-only bind mount
    # intentionally is not.
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: file:/tmp/ddbs-config-repo
