server:
  port: 8086
  shutdown: graceful

spring:
  application:
    name: payment-reservation-service
  config:
    import: optional:configserver:${SPRING_CONFIG_IMPORT:http://localhost:8888}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/ledger}
    username: ${SPRING_DATASOURCE_USERNAME:ddbs}
    password: ${SPRING_DATASOURCE_PASSWORD:ddbs}
    hikari:
      maximum-pool-size: 8
  flyway:
    locations: classpath:db/migration
    default-schema: payment
    schemas: payment
    create-schemas: true
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

redisson:
  single-server-config:
    address: ${REDISSON_ADDRESS:redis://localhost:6379}

app:
  account-service:
    url: ${ACCOUNT_SERVICE_URL:http://localhost:8081}
  offline-token:
    issuer: ${OFFLINE_TOKEN_ISSUER:ddbs-payment-reservation}
    default-ttl-minutes: ${OFFLINE_TOKEN_TTL_MINUTES:30}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{ISO8601} %-5level [%X{correlationId:-no-correlation}] %logger{36} - %msg%n"
