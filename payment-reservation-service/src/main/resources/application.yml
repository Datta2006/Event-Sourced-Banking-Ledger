server:
  port: 8086

spring:
  config:
    import: optional:configserver:${SPRING_CONFIG_IMPORT:http://localhost:8888}
  application:
    name: payment-reservation-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/ledger}
    username: ddbs
    password: ddbs
  jpa:
    hibernate:
      # schema is Flyway-managed (db/migration) — validate only, never mutate
      ddl-auto: validate
    show-sql: false
  flyway:
    locations: classpath:db/migration
    default-schema: payment
    schemas: payment
    create-schemas: true
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: payment-reservation-service
      properties:
        spring.json.trusted.packages: '*'
  data:
    redis:
      host: localhost
      port: 6379

# v2 §4.2: reservation TTL handling runs against Valkey via Redisson.
redisson:
  single-server-config:
    address: "redis://localhost:6379"

# v2 §4.2: offline payment tokens are signed asymmetrically (Nimbus JOSE+JWT).
# The private key stays bank-side; merchant devices verify with the public key offline.
offline-token:
  keystore-path: classpath:offline-token-signing-key.pem
  issuer: ddbs-payment-reservation
  default-ttl-minutes: 30

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true

management:
  endpoint:
    health:
      show-details: always   # expose db/kafka/redis indicators for compose healthcheck + CI
