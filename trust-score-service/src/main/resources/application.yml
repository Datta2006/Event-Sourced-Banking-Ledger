server:
  port: 8087

spring:
  config:
    import: optional:configserver:${SPRING_CONFIG_IMPORT:http://localhost:8888}
  application:
    name: trust-score-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/ledger}
    username: ddbs
    password: ddbs
  jpa:
    hibernate:
      # schema is Flyway-managed (db/migration) — validate only, never mutate
      ddl-auto: validate
    show-sql: false
  flyway:
    locations: classpath:db/migration
    default-schema: trust_score
    schemas: trust_score
    create-schemas: true
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: trust-score-service
      properties:
        spring.json.trusted.packages: '*'

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true

management:
  endpoint:
    health:
      show-details: always   # expose db/kafka indicators for compose healthcheck + CI
